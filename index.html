<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺南護理專科學校學生輔導中心 圖書及館藏借閱系統</title>
    <style>
        :root {
            --primary-color: #2b579a;
            --primary-dark: #1f3d6d;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* 需求4: 上方藍色方格拉大拉粗 */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2.2rem 3rem; /* 增加內邊距使視圖更大氣 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2.1rem; /* 字體放大 */
            font-weight: 700;
            letter-spacing: 1px;
        }

        .auth-status {
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .tabs {
            display: flex;
            background-color: #e9ecef;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            border-bottom: 2px solid var(--primary-color);
        }

        .tab-btn {
            padding: 14px 28px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: bold;
            color: #495057;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        /* 第一頁雙欄佈局 */
        .page1-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        /* 需求1: 左半邊不超過 1/3 (設定寬度 28%) */
        .left-panel {
            width: 28%;
            min-width: 280px;
            flex-shrink: 0;
        }

        .right-panel {
            flex: 1;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .card h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            font-size: 1.15rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 0.92rem;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }

        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { background-color: #bd2130; }

        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }

        .btn-success { background-color: var(--success-color); color: white; }
        .btn-success:hover { background-color: #218838; }

        .btn-sm { padding: 5px 10px; font-size: 0.85rem; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
        }

        .clickable-row:hover {
            background-color: #f1f5f9;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge-available { background-color: #d4edda; color: #155724; }
        .badge-borrowed { background-color: #f8d7da; color: #721c24; }

        .api-config {
            background-color: #e3f2fd;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .api-config input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background-color: #333;
            color: white;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- 需求4: 放大尺寸的頂部標題區 -->
    <header>
        <h1>國立臺南護理專科學校學生輔導中心 圖書及館藏借閱系統</h1>
        <div class="auth-status">
            <span id="adminDisplayName">訪客模式</span>
            <button id="loginBtn" class="btn btn-secondary btn-sm" onclick="showLoginPrompt()">管理者登入</button>
            <button id="logoutBtn" class="btn btn-danger btn-sm" onclick="handleLogout()" style="display: none;">登出</button>
        </div>
    </header>

    <div class="container">
        <!-- API URL 設定區 -->
        <div class="api-config">
            <label for="apiUrlInput"><strong>API 網址：</strong></label>
            <input type="text" id="apiUrlInput" placeholder="請貼上 Google Apps Script 部署後的 Web App API 網址">
            <button class="btn btn-primary btn-sm" onclick="saveApiUrl()">儲存網址</button>
        </div>

        <!-- 頁籤按鈕 (調整頁籤架構) -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-borrow', this)">第一頁：借還書與館藏查詢</button>
            <button class="tab-btn" onclick="switchTab('tab-items', this)">第二頁：館藏資料維護(新增/刪除)</button>
            <button class="tab-btn" onclick="switchTab('tab-users', this)">第三頁：借閱人員管理</button>
        </div>

        <!-- 需求1: 第一頁 (借還書功能在左側少於1/3，右側為可點選帶入的書籍館藏清單) -->
        <div id="tab-borrow" class="tab-content active">
            <div class="page1-layout">
                
                <!-- 左側：借還書功能 (寬度佔 28% < 1/3) -->
                <div class="left-panel">
                    <div class="card">
                        <h3>辦理借書 / 歸還</h3>
                        <div class="form-group">
                            <label>館藏編號 (點右側清單可自動帶入)</label>
                            <input type="text" id="actionItemId" placeholder="請輸入、掃描或點擊右側">
                        </div>
                        <div class="form-group">
                            <label>讀者編號 (借書時必填)</label>
                            <input type="text" id="actionUserId" placeholder="例如：S112001">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                            <button class="btn btn-primary" onclick="handleBorrowItem()">辦理借出</button>
                            <button class="btn btn-success" onclick="handleReturnItem()">辦理歸還</button>
                        </div>
                    </div>
                </div>

                <!-- 右側：館藏清單與分類篩選 (直接點選帶入編號) -->
                <div class="right-panel">
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h3 style="border: none; margin: 0; padding: 0;">館藏快速查詢與選擇</h3>
                            <button class="btn btn-secondary btn-sm" onclick="loadItems(true)">重新整理</button>
                        </div>

                        <!-- 分類篩選 Bar -->
                        <div class="filter-bar">
                            <label><strong>館藏分類篩選：</strong></label>
                            <select id="categoryFilter" onchange="renderQuickItemsTable()" style="padding: 5px 10px; border-radius: 4px;">
                                <option value="ALL">全部類別</option>
                                <option value="書籍">書籍</option>
                                <option value="牌卡桌游">牌卡桌游</option>
                                <option value="DVD">DVD</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th>編號</th>
                                    <th>類型</th>
                                    <th>名稱</th>
                                    <th>作者/發行</th>
                                    <th>狀態</th>
                                    <th>點選帶入</th>
                                </tr>
                            </thead>
                            <tbody id="quickItemsTableBody">
                                <tr><td colspan="6" style="text-align:center;">載入中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

        <!-- 需求2: 第二頁 (新增、刪除、圖書跟館藏清單) -->
        <div id="tab-items" class="tab-content">
            <div class="card">
                <h3>新增館藏資料</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>館藏編號</label>
                        <input type="text" id="newItemId" placeholder="例如：B001">
                    </div>
                    <div class="form-group">
                        <label>名稱 / 書名</label>
                        <input type="text" id="newItemTitle" placeholder="例如：情緒勒索">
                    </div>
                    <div class="form-group">
                        <label>類型</label>
                        <select id="newItemType">
                            <option value="書籍">書籍</option>
                            <option value="牌卡桌游">牌卡桌游</option>
                            <option value="DVD">DVD</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>作者 / 發行單位</label>
                        <input type="text" id="newItemAuthor" placeholder="例如：周慕姿">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="handleAddItem()">新增館藏</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="border: none; margin: 0; padding: 0;">完整館藏維護清單</h3>
                    <button class="btn btn-secondary btn-sm" onclick="loadItems(true)">重新整理</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>編號</th>
                            <th>類型</th>
                            <th>名稱</th>
                            <th>作者/發行</th>
                            <th>狀態</th>
                            <th>管理操作</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody">
                        <tr><td colspan="6" style="text-align:center;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 需求3: 第三頁 (借閱人員管理) -->
        <div id="tab-users" class="tab-content">
            <div class="card">
                <h3>新增借閱人員 (讀者)</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>讀者編號/學號</label>
                        <input type="text" id="newUserId" placeholder="例如：S112001">
                    </div>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="newUserName" placeholder="例如：王小明">
                    </div>
                    <div class="form-group">
                        <label>電子郵件</label>
                        <input type="email" id="newUserEmail" placeholder="例如：user@example.com">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="handleAddUser()">新增人員</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="border: none; margin: 0; padding: 0;">借閱人員資料與統計清單</h3>
                    <button class="btn btn-secondary btn-sm" onclick="loadUsers(true)">重新整理</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>讀者編號</th>
                            <th>姓名</th>
                            <th>Email</th>
                            <th>目前借閱數</th>
                            <th>累計借閱數</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" style="text-align:center;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="toast"></div>

    <script>
        let rawItemsData = []; // 暫存館藏資料以利快速過濾

        document.addEventListener("DOMContentLoaded", () => {
            const savedUrl = localStorage.getItem('apiUrl');
            if (savedUrl) {
                document.getElementById('apiUrlInput').value = savedUrl;
            }
            checkLoginStatus();
            loadItems();
        });

        function getApiUrl() {
            return localStorage.getItem('apiUrl') || '';
        }

        function saveApiUrl() {
            const url = document.getElementById('apiUrlInput').value.trim();
            if (!url) return showToast('請輸入有效的 API 網址', true);
            localStorage.setItem('apiUrl', url);
            showToast('API 網址已設定完畢');
            loadItems(true);
        }

        function getToken() {
            return localStorage.getItem('adminToken') || '';
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.backgroundColor = isError ? '#dc3545' : '#333';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // 切換 Tab
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'tab-borrow' || tabId === 'tab-items') loadItems();
            if (tabId === 'tab-users') loadUsers();
        }

        // 管理員身份處理
        function checkLoginStatus() {
            const token = getToken();
            const adminName = localStorage.getItem('adminName');

            if (token && adminName) {
                document.getElementById('adminDisplayName').innerText = `已登入：${adminName}`;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
            } else {
                document.getElementById('adminDisplayName').innerText = `訪客模式`;
                document.getElementById('loginBtn').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        }

        async function showLoginPrompt() {
            const username = prompt("請輸入管理者帳號：");
            if (!username) return;
            const password = prompt("請輸入管理者密碼：");
            if (!password) return;

            const url = getApiUrl();
            if (!url) return showToast('請先填寫 API 網址', true);

            showToast('登入驗證中...');
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username, password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminName', data.adminName);
                    showToast('登入成功');
                    checkLoginStatus();
                } else {
                    showToast(data.message, true);
                }
            } catch (e) {
                showToast('登入請求失敗，請確認 API 網址', true);
            }
        }

        function handleLogout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminName');
            showToast('已登出');
            checkLoginStatus();
        }

        function handleApiResponse(data) {
            if (data.status === 'unauthorized') {
                handleLogout();
                showToast(data.message, true);
                return false;
            }
            return true;
        }

        // 載入館藏資料
        async function loadItems(force = false) {
            const url = getApiUrl();
            if (!url) return;

            try {
                const res = await fetch(`${url}?type=items${force ? '&t=' + Date.now() : ''}`);
                const data = await res.json();
                rawItemsData = data;
                renderQuickItemsTable(); // 渲染第一頁清單
                renderItemsTable();      // 渲染第二頁管理清單
            } catch (e) {
                console.error('無法取得館藏資料', e);
            }
        }

        // 需求1: 第一頁館藏清單渲染與分類篩選
        function renderQuickItemsTable() {
            const tbody = document.getElementById('quickItemsTableBody');
            tbody.innerHTML = '';

            const selectedCategory = document.getElementById('categoryFilter').value;
            const filteredData = selectedCategory === 'ALL' 
                ? rawItemsData 
                : rawItemsData.filter(i => i.itemType === selectedCategory);

            if (!Array.isArray(filteredData) || filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">無符合條件之館藏資料</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                const badgeClass = item.status === '可借閱' ? 'badge-available' : 'badge-borrowed';
                const tr = document.createElement('tr');
                tr.className = 'clickable-row';
                tr.innerHTML = `
                    <td><strong>${item.id}</strong></td>
                    <td>${item.itemType}</td>
                    <td>${item.title}</td>
                    <td>${item.author}</td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="selectItemCode('${item.id}')">選取帶入</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 點選代入館藏編號至左側輸入框
        function selectItemCode(itemId) {
            document.getElementById('actionItemId').value = itemId;
            showToast(`已選取編號：${itemId}`);
        }

        // 第二頁館藏管理清單渲染
        function renderItemsTable() {
            const tbody = document.getElementById('itemsTableBody');
            tbody.innerHTML = '';

            if (!Array.isArray(rawItemsData) || rawItemsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">目前無館藏資料</td></tr>';
                return;
            }

            rawItemsData.forEach(item => {
                const badgeClass = item.status === '可借閱' ? 'badge-available' : 'badge-borrowed';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.itemType}</td>
                    <td>${item.title}</td>
                    <td>${item.author}</td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="handleDeleteItem('${item.id}', '${item.title}')">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 第三頁讀者清單渲染
        async function loadUsers(force = false) {
            const url = getApiUrl();
            if (!url) return;

            try {
                const res = await fetch(`${url}?type=users${force ? '&t=' + Date.now() : ''}`);
                const data = await res.json();
                renderUsersTable(data);
            } catch (e) {
                console.error('無法取得讀者資料', e);
            }
        }

        function renderUsersTable(data) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">目前無人員資料</td></tr>';
                return;
            }

            data.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.currentBorrowed} / ${u.maxLimit} 本</td>
                    <td>${u.totalBorrowed} 次</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // POST 動作操作
        async function handleAddItem() {
            const id = document.getElementById('newItemId').value.trim();
            const title = document.getElementById('newItemTitle').value.trim();
            const itemType = document.getElementById('newItemType').value;
            const author = document.getElementById('newItemAuthor').value.trim();

            if (!id || !title) return showToast('請輸入館藏編號與名稱', true);

            await sendPostAction({ action: 'addItem', id, title, itemType, author }, () => {
                document.getElementById('newItemId').value = '';
                document.getElementById('newItemTitle').value = '';
                document.getElementById('newItemAuthor').value = '';
                loadItems(true);
            });
        }

        async function handleDeleteItem(itemId, itemTitle) {
            if (!confirm(`確定要刪除館藏「${itemTitle}」(編號: ${itemId}) 嗎？`)) {
                return;
            }

            await sendPostAction({ action: 'deleteItem', id: itemId }, () => {
                loadItems(true);
            });
        }

        async function handleAddUser() {
            const user_id = document.getElementById('newUserId').value.trim();
            const name = document.getElementById('newUserName').value.trim();
            const email = document.getElementById('newUserEmail').value.trim();

            if (!user_id || !name) return showToast('請輸入讀者編號與姓名', true);

            await sendPostAction({ action: 'addUser', user_id, name, email }, () => {
                document.getElementById('newUserId').value = '';
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserEmail').value = '';
                loadUsers(true);
            });
        }

        async function handleBorrowItem() {
            const item_id = document.getElementById('actionItemId').value.trim();
            const user_id = document.getElementById('actionUserId').value.trim();

            if (!item_id || !user_id) return showToast('請填寫館藏編號與讀者編號', true);

            await sendPostAction({ action: 'borrowItem', item_id, user_id }, () => {
                document.getElementById('actionItemId').value = '';
                loadItems(true);
            });
        }

        async function handleReturnItem() {
            const item_id = document.getElementById('actionItemId').value.trim();

            if (!item_id) return showToast('請填寫館藏編號', true);

            await sendPostAction({ action: 'returnItem', item_id }, () => {
                document.getElementById('actionItemId').value = '';
                loadItems(true);
            });
        }

        async function sendPostAction(payload, onSuccess) {
            const url = getApiUrl();
            const token = getToken();

            if (!url) return showToast('請先設定 API 網址', true);

            showToast('請求處理中...');
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify({ ...payload, token })
                });
                const data = await res.json();
                if (!handleApiResponse(data)) return;

                showToast(data.message, data.status !== 'success');
                if (data.status === 'success' && onSuccess) {
                    onSuccess();
                }
            } catch (e) {
                showToast('操作失敗，請檢查 API 設定與網路', true);
            }
        }
    </script>
</body>
</html>
